# Synology Container Manager > Project > Create: paste this, set the two
# addresses, keep the volume paths (create /volume1/docker/claude-amiga first).
services:
  claude-amiga:
    build: .
    image: claude-amiga:latest
    container_name: claude-amiga
    restart: unless-stopped
    network_mode: host          # uptelnetd listens on the NAS's own LAN address
    environment:
      NAS_IP: "192.168.0.10"    # CHANGE: the NAS's LAN address
      ALLOW: "192.168.0.0/24"   # CHANGE: your LAN (only these may connect)
      PORT: "2323"
    volumes:
      - /volume1/docker/claude-amiga/home:/home/claude   # login, settings, password, history
