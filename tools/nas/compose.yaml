# Synology Container Manager > Project > Create, source: this folder with
# uptelnetd.py beside it (create /volume1/docker/claude-amiga/home first).
services:
  claude-amiga:
    # With both image and build, `docker compose up` PULLS the image when it is not on this
    # machine and only builds when the pull fails or you run `docker compose build` / `up --build`
    # (the build needs uptelnetd.py beside this file; see README.md). Pull users need no build.
    image: ghcr.io/spotup/claude-amiga:latest
    build: .
    container_name: claude-amiga
    restart: unless-stopped
    network_mode: host          # uptelnetd listens on the NAS's own LAN address
    environment:
      # Site settings live in a .env file beside this one (copy env.example to .env and edit it).
      # Never edit them here: a deploy or image update replaces this file, and .env is never shipped.
      # The container refuses to start while they are still the EDIT-ME defaults.
      NAS_IP: "${NAS_IP:-EDIT-ME-NAS-LAN-ADDRESS 127.0.0.1}"
      ALLOW: "${ALLOW:-EDIT-ME-LAN-NETWORK 127.0.0.0/8}"
      PORT: "2323"
    volumes:
      - ${CLAUDE_HOME:-/volume1/docker/claude-amiga/home}:/home/claude   # login, settings, password, history
