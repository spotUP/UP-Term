# Builds the Claude Code server image (tools/nas) for amd64 and arm64 and pushes it to
# ghcr.io/spotup/claude-amiga and, when the secrets exist, to Docker Hub.
# Trigger: a tag like nas-v1 (the version is the tag without "nas-"), or run by hand.
name: nas-image

on:
  push:
    tags: ['nas-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile COPYs uptelnetd.py from its own folder; in the repo it lives in tools/.
      - name: Put uptelnetd.py beside the Dockerfile
        run: cp tools/uptelnetd.py tools/nas/uptelnetd.py

      - name: Work out the version and tags
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#nas-}"; else v="dev-${GITHUB_SHA::7}"; fi
          tags="ghcr.io/spotup/claude-amiga:${v}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="${tags},ghcr.io/spotup/claude-amiga:latest"; fi
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            tags="${tags},docker.io/${DOCKERHUB_USERNAME}/claude-amiga:${v}"
            if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="${tags},docker.io/${DOCKERHUB_USERNAME}/claude-amiga:latest"; fi
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub skipped: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set."
            echo "hub=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.meta.outputs.hub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tools/nas
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/spotUP/UP-Term
            org.opencontainers.image.title=claude-amiga
            org.opencontainers.image.description=Claude Code in tmux for the Amiga, reached through UP-Term uptelnet
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
