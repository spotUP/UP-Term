; UP-Term window preferences. The XCON: handler reads this file at startup;
; the Prefs app (UP-Term Prefs) writes it. Without the file every XCON:
; window behaves exactly as before preferences existed.
;
; Profiles: sections named "[profile <name>]". A window takes the profile
; named by its spec option  PROFILE <name>  (default: "default"). Keys and
; names are case-insensitive. A later section with the same name adds to
; the earlier one (last value wins). Keys and profile names are not
; inherited from other profiles: a profile only changes what it names.
;
; Precedence, low to high: the built-in defaults < the profile < the window
; spec options (XCON:.../DARK, /FG rrggbb, /FONT ...) < the running program
; (OSC 4/10/11/12 colours, DECSCUSR, DECSC).
;
;   ; -- the default profile: every XCON: window without PROFILE <name>
;   [profile default]
;   ; font = TOPAZ:8.8.font        ; name:size, any fixed-width font
;   ; fg = C0C0C0                  ; default foreground, RRGGBB hex
;   ; bg = 000000                  ; default background
;   ; scrollback = 2000            ; lines to keep (0 = the built-in 500, -1 = none)
;   ; cursor = block               ; block | underline | bar (xterm DECSCUSR shape)
;   ; cursor-blink = off           ; on | off (xterm ?12)
;   ; cursor-color = inverse       ; inverse (the flipped cell) or RRGGBB
;   ; bell = beep                  ; none | beep | visual (a one-frame screen flash)
;   ; bold-bright = on             ; xterm: SGR 1 takes the bright 8-15
;   ; meta = alt                  ; alt (Alt = Meta, default) | amiga (Left Amiga = Meta; Super stays Left Amiga in the keymap)
;   ; copy-on-select = off         ; on: a mouse drag ends with the text on the clipboard
;   ; wheel = scroll               ; scroll | ignore (the mouse wheel moves the scrollback)
;   ; reflow = on                  ; on | off (a resize re-wraps the lines and the scrollback)
;   ; menu-style = graphical      ; graphical | text | minimal: which menu and key viewer Left Amiga + Space and + K open (over an UP-Term window menu-in-terminal decides); minimal is the drawn menu as plain text rows in the fg and bg colours
;   ; menu-in-terminal = text     ; text | graphical: the menu while an UP-Term window is active (a full-screen terminal always gets text)
;   ; amarchy-app-icons = generic ; generic | amiga | none: the icons of app and game rows in the drawn menu (amiga: their .info images; none: no icon column)
;   ; amarchy-index-skip =        ; comma separated paths the app index scan leaves out (whole-path prefixes), e.g. Work:Old,DH1:Backup
;   ; backspace = del              ; del | bs: what Backspace sends (bs, ^H, for a remote host whose
;   ;                                ; terminfo says kbs=^H -- upstream ncurses' xterm-256color, as on
;   ;                                ; Arch or macOS; Debian and Fedora say ^?). A program can switch
;   ;                                ; it with DECBKM (?67).
;   ; amiga-keys = on              ; on | off: Shift+Left / Shift+Right send Home / End (the line's start
;   ;                                ; and end, as in the AmigaShell) instead of xterm's CSI 1;2D / 1;2C
;   ; dither = on                 ; on | off: a screen of 16 colours or fewer draws a colour no pen shows
;   ;                                ; closely with two pens in a pattern (off: the nearest single pen)
;   ; outline-antialias = on        ; on | off: outline-font glyphs are drawn smoothed (off: hard edges)
;   ; padding-color = background   ; background | extend: the strips beside the character grid are the
;   ;                                ; background, or take the colour of the cell next to them
;   ; highlight-cat = on           ; on | off: vsh's cat is hl -p (colours; .md formatted as mdv does);
;   ;                                ; the save writes it to ENV:up-term/highlight-cat for the vshrc
;   ; program-clipboard = write     ; write | read-write | off: what programs may do with the
;   ;                               ; clipboard (OSC 52). read-write lets any program -- a
;   ;                               ; remote one over ssh too -- read what you copied
;   ; link-open = OpenURL %s        ; the command Ctrl + click on a link runs, %s the URL
;   ; scrollbar = show             ; show | hide (the scroll bar in a sizable window's border)
;   ; palette = 1,0x00CD00,4,0x5C5CFF   ; remap the 16 ANSI colours: index,RRGGBB pairs
;
;   ; -- one for the editor: the same keys, only what it changes
;   ; [profile vim]
;   ; font = PARADISEC:8.8.font
;   ; bell = none
;
;   ; a window gets it:  NewShell "XCON:0/20/640/300/vim/PROFILE vim/CLOSE"
