# upkg.conf: the configuration upkg (the opkg 0.9.0 build) reads from UP-Term:etc/upkg.conf.
# The kit ships it (Files/upkg.conf, part system). One dest, root "/": ixemul reads /T/x as T:x, so a
# package's data.tar paths ./T/upkg-stage/<archive>/... land in T:upkg-stage/<archive>, where its
# postinst runs Files/install.dos and deletes the tree. The base is not a package.
arch m68k-amigaos 10
src/gz upterm https://github.com/spotUP/vtcon/releases/latest/download
dest root /
option lists_dir /UP-Term/pkg/upkg/lists
option info_dir /UP-Term/pkg/upkg/info
option status_file /UP-Term/pkg/upkg/status
option cache_dir /UP-Term/pkg/upkg/cache
option lock_file /UP-Term/pkg/upkg/lock
# AmigaDOS has no file owners: without this, every entry of a package prints "Can't set UID=0".
option ignore_uid 1
