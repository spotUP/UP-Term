; Amarchy status bar settings (ENVARC:Amarchy/bar.conf; ENV:Amarchy/bar.conf is read first).
; Install lays this file down only when ENVARC:Amarchy/bar.conf does not exist, so your edits stay.
; One row a line; a row starting with ; or # is a comment. A bad row is ignored.
;
;   start on|off                     the bar at start (super+b switches it at any time)
;   clock <format>                   the clock text: %a %d %b %Y %H %M (day name, day, month, year, hour, minute)
;   clockalt <format>                the clock text after a click on it
;   left|centre|right <segment> ...  the order of a group; segments: screens clock cpu ram network agents system tray
;   segment <name> on|off            show or hide one segment
;   run <label> <command line>       a tray entry that starts the command when clicked
;
start on
clock %a %H:%M
clockalt %a %d %b %Y
